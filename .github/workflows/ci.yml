name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Dummy values so env validation passes at build time. No network
          # calls are made during the build; real secrets live in Vercel.
          NODE_ENV: production
          TOKEN_SECRET: ci_dummy_token_secret_at_least_32_chars_long
          MONGODB_URI: mongodb://localhost:27017/sdg-buddy-ci
          DOMAIN: https://example.com
          RESEND_API_KEY: re_ci_dummy_key
          GEMINI_API_KEY: ci_dummy_gemini_key
          ALLOWED_ORIGINS: example.com
